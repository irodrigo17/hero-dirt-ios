name: iOS starter workflow

on:
  push:
    branches: [ "main", "codex/dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test HeroDirt
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run complete pre-commit checks
        env:
          CI_OUTPUT_DIR: ${{ runner.temp }}
        run: bash scripts/check-ci.sh

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-and-test-results
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/HeroDirtTests.xcresult
          if-no-files-found: ignore
