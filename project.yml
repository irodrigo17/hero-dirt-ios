name: HeroDirt
options:
  bundleIdPrefix: com.herodirt
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: K3CQQKBR25
    CODE_SIGN_IDENTITY: "iPhone Developer"
targets:
  HeroDirt:
    type: application
    platform: iOS
    sources:
      - path: HeroDirt
    info:
      path: HeroDirt/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Hero Dirt can use your location to center the map."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          BackgroundColor: LaunchBackground
          ImageName: LaunchImage
    entitlements:
      path: HeroDirt/HeroDirt.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.herodirt.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herodirt.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"

  HeroDirtTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeroDirtTests
    dependencies:
      - target: HeroDirt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herodirt.app.tests
        GENERATE_INFOPLIST_FILE: YES
