name: HeroDirt
options:
  bundleIdPrefix: com.herodirt
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
targets:
  HeroDirt:
    type: application
    platform: iOS
    sources:
      - path: HeroDirt
    settings:
      base:
        INFOPLIST_FILE: HeroDirt/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.herodirt.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Hero Dirt can use your location to center the map."
