name: HeroDirt
options:
  bundleIdPrefix: com.herodirt
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
targets:
  HeroDirt:
    type: application
    platform: iOS
    sources:
      - path: HeroDirt
    settings:
      base:
        INFOPLIST_FILE: HeroDirt/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.herodirt.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: K3CQQKBR25
        CODE_SIGN_IDENTITY: iPhone Developer
        CODE_SIGN_ENTITLEMENTS: HeroDirt/HeroDirt.entitlements
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Hero Dirt can use your location to center the map."

  HeroDirtTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeroDirtTests
    dependencies:
      - target: HeroDirt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herodirt.app.tests
        SWIFT_VERSION: "5.9"
